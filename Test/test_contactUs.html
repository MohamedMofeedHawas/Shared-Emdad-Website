      transition: color 0.2s ease;
    }

    .emdad-nav-link::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 8px;
      right: 8px;
      height: 2px;
      background: #d4af37;
      border-radius: 2px;
      transition: opacity 0.2s ease;
      opacity: 0;
    }

    .emdad-nav-link:hover,
    .emdad-nav-link.active {

    }

    .emdad-nav-link.active::after,
    .emdad-nav-link:hover::after {
      opacity: 1 !important;
    }

    /* DROPDOWN MENU (DARK DESIGN) */
    .emdad-navbar .nav-item.dropdown {
      position: relative;
    }

    @media (min-width: 992px) {

      }

  <!-- JS Scripts for Bootstrap & Language Switcher -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Language Toggle Functionality
    function toggleLanguage() {
      const htmlTag = document.documentElement;
      const currentLang = htmlTag.getAttribute('lang');
      const newLang = currentLang === 'en' ? 'ar' : 'en';
      const newDir = newLang === 'ar' ? 'rtl' : 'ltr';

      // Change HTML Attributes
      htmlTag.setAttribute('lang', newLang);
      htmlTag.setAttribute('dir', newDir);

      // Update Language Switch Button Text
      const langText = document.getElementById('langText');
      langText.textContent = newLang === 'en' ? 'العربية' : 'English';

      // Switch text content for all translatable elements
      const translatableElements = document.querySelectorAll('[data-ar][data-en]');
      translatableElements.forEach(el => {
        el.textContent = el.getAttribute(`data-${newLang}`);
      });
    }
  </script>
